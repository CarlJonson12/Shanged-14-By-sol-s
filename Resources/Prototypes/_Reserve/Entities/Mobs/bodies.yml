# region Organs

# Insects

- type: entity
  parent: BaseAnimalOrgan
  id: OrganInsectInnards
  name: innards
  description: A mess of insect equivalents of organs. Ew.
  suffix: Cockroach, Organ, Stomach, Liver, Kidneys, Heart, Egg sack
  components:
  - type: Sprite
    sprite: _White/Mobs/Species/Xenomorph/organs.rsi
    state: egg_sack
    scale: 0.25, 0.25
  - type: SolutionContainerManager
    solutions:
      stomach:
        maxVol: 30
      food:
        maxVol: 5
        reagents:
        - ReagentId: InsectBlood
          Quantity: 5
  - type: Organ  # Shitmed
    intCap: 35
    integrity: 35
    integrityThresholds:
      Normal: 35
      Damaged: 19
      Destroyed: 0
    slotId: stomach
  - type: Heart  # Shitmed
  - type: Stomach
  - type: Metabolizer
    maxPoisonsProcessable: 6
    metabolizerTypes: [ Animal ]
    removeEmpty: true
    groups:
      - id: Food
      - id: Drink
      - id: Medicine
      - id: Poison
      - id: Narcotic
      - id: Alcohol
        rateModifier: 0.1
  - type: Tag
    tags:
    - Meat
    - Organ
    - Stomach
    - Heart
    - Liver
    - Kidneys
  - type: Item
    size: Small
    heldPrefix: stomach

- type: entity
  parent: OrganAnimalLungs
  id: OrganInsectInnardsLungs
  name: innards
  description: A mess of insect equivalents of organs. Ew.
  suffix: Cockroach, Organ, Lungs
  components:
  - type: Sprite
    sprite: _White/Mobs/Species/Xenomorph/organs.rsi
    layers:
    - state: egg_sack
    scale: 0.25, 0.25

# Critters

- type: entity
  parent: OrganAnimalLungs
  id: OrganAnimalLungsSmall
  components:
  - type: Sprite
    scale: 0.6, 0.6

- type: entity
  parent: OrganAnimalStomach
  id: OrganAnimalStomachSmall
  components:
  - type: Sprite
    scale: 0.6, 0.6

- type: entity
  parent: OrganAnimalLiver
  id: OrganAnimalLiverSmall
  components:
  - type: Sprite
    scale: 0.6, 0.6

- type: entity
  parent: OrganAnimalHeart
  id: OrganAnimalHeartSmall
  components:
  - type: Sprite
    scale: 0.6, 0.6

- type: entity
  parent: OrganAnimalKidneys
  id: OrganAnimalKidneysSmall
  components:
  - type: Sprite
    scale: 0.6, 0.6

# endregion

# region Bodies

- type: body
  id: Insect
  name: insect
  root: chest
  slots:
    chest:
      part: ChestAnimal
      connections:
      - groin
      organs:
        lungs: OrganInsectInnardsLungs
    groin:
      part: GroinAnimal
      connections:
      - legs
      organs:
        stomach: OrganInsectInnards
    legs:
      part: LegsAnimal
      connections:
      - feet
    feet:
      part: FeetAnimal

- type: body
  id: Critter
  name: critter
  root: chest
  slots:
    chest:
      part: ChestAnimal
      connections:
      - groin
      organs:
        lungs: OrganAnimalLungsSmall
        heart: OrganAnimalHeartSmall
    groin:
      part: GroinAnimal
      connections:
      - legs
      organs:
        stomach: OrganAnimalStomachSmall
        liver: OrganAnimalLiverSmall
        kidneys: OrganAnimalKidneysSmall
    legs:
      part: LegsAnimal
      connections:
      - feet
    feet:
      part: FeetAnimal

# endregion Bodies
