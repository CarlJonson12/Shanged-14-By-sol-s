- type: entity
  id: ActionRevenantHaunt
  name: Haunt
  parent: BaseAction # reserve edit
  description: Gives essence and stolen essence for every witness.
  components:
  - type: Action # reserve edit
    itemIconStyle: NoItem
    icon:
      sprite: _Goobstation/Actions/actions_revenant.rsi
      state: transmit
  - type: InstantAction
    event: !type:RevenantHauntActionEvent

- type: entity
  id: ActionRevenantBloodWriting
  name: Blood Writing
  parent: BaseAction # reserve edit
  description: Costs 2 Essence per glyph.
  components:
  - type: Action # reserve edit
    itemIconStyle: NoItem
    icon: Interface/Actions/blood-writing.png
  - type: InstantAction
    event: !type:RevenantBloodWritingEvent

- type: entity
  id: ActionRevenantAnimate
  name: Animate
  parent: BaseAction # reserve edit
  description: Items within 3 tiles hover and hurl themselves at anyone who comes close. Costs 50 Essence. # reserve edit
  components:
  - type: Action # reserve edit
    itemIconStyle: NoItem
    icon: Interface/Actions/animate.png
    useDelay: 10
  - type: InstantAction # reserve edit - animates every item within 3 tiles instead of one target
    event: !type:RevenantAnimateEvent
